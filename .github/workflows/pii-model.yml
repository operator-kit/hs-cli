name: PII Model Release

on:
  push:
    tags:
      - "pii-model-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/pii-model-v}"
          LOCKED="$(jq -r '.bundle_version' scripts/pii-model-sources.json)"
          if [[ "$TAG" != "$LOCKED" ]]; then
            echo "tag version $TAG does not match source lock $LOCKED" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify embedded trust manifest
        run: go test ./internal/pii/ner -run 'TestTrustedManifest' -count=1

      - name: Build platform bundles
        run: ./scripts/prepare-pii-model.sh dist/pii-model
        env:
          PII_MODEL_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify release asset and manifest coverage
        run: |
          jq -S . internal/pii/ner/trusted_manifest.json > /tmp/expected-manifest.json
          jq -S . dist/pii-model/trusted_manifest.json > /tmp/generated-manifest.json
          cmp /tmp/expected-manifest.json /tmp/generated-manifest.json

          mapfile -t platforms < <(jq -r '.onnx_runtime.platforms[] | "\(.goos)-\(.goarch)"' scripts/pii-model-sources.json)
          test "$(find dist/pii-model -maxdepth 1 -name 'pii-model-*.tar.gz' | wc -l)" -eq "${#platforms[@]}"
          for platform in "${platforms[@]}"; do
            asset="pii-model-${{ steps.version.outputs.version }}-${platform}.tar.gz"
            test -f "dist/pii-model/${asset}"
            test -f "dist/pii-model/${asset}.sha256"
            (cd dist/pii-model && sha256sum -c "${asset}.sha256")
          done

      - name: Upload verified bundle set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pii-model-bundles
          path: dist/pii-model

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pii-model-bundles
          path: dist/pii-model

      - name: Execute runtime and model smoke test
        run: |
          mkdir -p smoke-model
          tar xzf "dist/pii-model/pii-model-${{ needs.build.outputs.version }}-${{ matrix.platform }}.tar.gz" -C smoke-model
          HS_PII_MODEL_SMOKE_DIR="$PWD/smoke-model" go test ./internal/pii/ner -run TestRuntimeBundleSmoke -count=1 -timeout=5m

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pii-model-bundles
          path: dist/pii-model

      - name: Create release and upload assets
        run: |
          gh release create "pii-model-v${{ needs.build.outputs.version }}" \
            --title "PII Model v${{ needs.build.outputs.version }}" \
            --notes "PII redaction model bundle (distilbert-base-multilingual-cased-ner-hrl, INT8 quantized) + ONNX Runtime." \
            dist/pii-model/pii-model-*.tar.gz \
            dist/pii-model/pii-model-*.tar.gz.sha256 \
            dist/pii-model/trusted_manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
